# Envoy sidecar enforcing mTLS on all inter-service calls (issue #394).
#
# Every service pod runs the API container (plain HTTP on 127.0.0.1:8080) and
# this sidecar:
#
#   inbound  :8443   requires a client certificate from spiffe://tessera.io
#   outbound         presents the pod's SVID to peers and verifies theirs
#
# Certificates come from the SPIRE agent's Workload API over its Unix socket;
# nothing is written to disk and rotation is handled by Envoy's SDS stream.
#
# Rejecting unauthenticated connections: `require_client_certificate: true`
# plus a validation context restricted to `spiffe://tessera.io/` means a
# connection without a valid SVID fails the TLS handshake, so it never reaches
# the application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-mtls
  namespace: prod
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
        - name: inbound_mtls
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: inbound
                    route_config:
                      name: inbound
                      virtual_hosts:
                        - name: local
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: local_app
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: spiffe://tessera.io
                        sds_config: &sds
                          api_config_source:
                            api_type: GRPC
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              prefix: "spiffe://tessera.io/"
                      validation_context_sds_secret_config:
                        name: spiffe://tessera.io
                        sds_config: *sds

      clusters:
        # The application container. Plain HTTP because it is only reachable
        # from this sidecar's loopback.
        - name: local_app
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: local_app
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080

        # Any Tessera peer. Replace STRICT_DNS with ORIGINAL_DST when the
        # caller dials peers directly; the TLS settings stay the same.
        - name: tessera_peers
          connect_timeout: 1s
          type: STRICT_DNS
          load_assignment:
            cluster_name: tessera_peers
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: tessera-api.prod.svc.cluster.local
                          port_value: 8443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: spiffe://tessera.io
                    sds_config: &sds_upstream
                      api_config_source:
                        api_type: GRPC
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          prefix: "spiffe://tessera.io/ns/prod/sa/"
                  validation_context_sds_secret_config:
                    name: spiffe://tessera.io
                    sds_config: *sds_upstream

        # The local SPIRE agent Workload API (Unix socket, filesystem
        # permissions are the access control).
        - name: spire_agent
          connect_timeout: 1s
          http2_protocol_options: {}
          type: STATIC
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe:
                          path: /run/spire/sockets/agent.sock
---
# Example: the sidecar added to the API Deployment. The API itself listens on
# loopback only; peers must dial 8443.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessera-api
  namespace: prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tessera-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessera-api
    spec:
      containers:
        - name: tessera-api
          image: ghcr.io/a4-stellar/tessera-api:latest
          env:
            - name: PORT
              value: "8080"
            - name: BIND_ADDRESS
              value: 127.0.0.1
            - name: SPIFFE_SVID_DIR
              value: /svids
            - name: SPIFFE_ID
              value: spiffe://tessera.io/ns/prod/sa/tessera-api
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /svids
              readOnly: true
        - name: envoy
          image: envoyproxy/envoy:v1.31.0
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-mtls
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
