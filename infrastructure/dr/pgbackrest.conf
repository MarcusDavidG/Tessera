# Tessera — pgBackRest configuration for continuous WAL archiving
# (issue #393).
#
# Install at /etc/pgbackrest/pgbackrest.conf on the primary (and on the warm
# standby, which needs the same repositories to restore from). Secrets come
# from the environment (`PGBACKREST_REPO1_S3_KEY`, …) or, preferably, from
# AWS/GCP instance roles; never commit them here.
#
# RPO target: 5 minutes. `archive_timeout = 300` in postgresql.conf forces a
# WAL switch (and therefore an archive-push) at least every five minutes even
# on an idle database, and `archive-async=y` keeps the push off the commit
# path. `archive-push-queue-max` bounds how much WAL may accumulate while a
# repository is unreachable before PostgreSQL stops accepting writes.

[global]
# WAL is pushed as soon as it is complete; async spooling absorbs latency
# spikes without blocking commits.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB

# Keep 7 days of full/differential backups, 30 days of WAL. This bounds the
# recovery window to the most recent 5 minutes while retaining enough history
# for point-in-time recovery.
repo1-retention-full=7
repo1-retention-full-type=time
repo1-retention-archive=30
repo1-retention-archive-type=time

# Parallelism: 4 processes is enough for a single primary and keeps the
# restore inside the 15-minute RTO.
process-max=4
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Do not silently continue when the archive is behind.
start-fast=y
delta=y

# ---------------------------------------------------------------------------
# Repository 1 — AWS S3 (primary, cross-region replicated by the bucket policy)
# ---------------------------------------------------------------------------
repo1-type=s3
repo1-path=/tessera/postgres
repo1-s3-bucket=tessera-dr-backups
repo1-s3-region=us-east-1
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<from PGBACKREST_REPO1_CIPHER_PASS>

# ---------------------------------------------------------------------------
# Repository 2 — Google Cloud Storage (secondary cloud, used by the warm
# standby in GCP and by the weekly drill when S3 is unavailable)
# ---------------------------------------------------------------------------
repo2-type=gcs
repo2-path=/tessera/postgres
repo2-gcs-bucket=tessera-dr-backups-gcs
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=<from PGBACKREST_REPO2_CIPHER_PASS>

# ---------------------------------------------------------------------------
# Stanza — one cluster
# ---------------------------------------------------------------------------
[tessera]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
# Replica hosts used for backup from a standby (optional; keeps full backups
# off the primary). The standby in the drill restores from repo1/repo2.
# pg1-host=primary.internal
